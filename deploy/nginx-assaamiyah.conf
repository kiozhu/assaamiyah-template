# HTTP -> paksa redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name assaamiyah.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assaamiyah.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/assaamiyah.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assaamiyah.duckdns.org/privkey.pem;

    # --- TLS modern (lindungi koneksi pengunjung) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Sembunyikan versi nginx
    server_tokens off;

    # --- Header keamanan untuk pengunjung ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Batasi ukuran request (situs statis, tak perlu besar)
    client_max_body_size 1m;

    # Hanya izinkan metode baca
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Tolak file tersembunyi (.git, .env, dll) di edge
    location ~ /\. { deny all; }

    location / {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
