# Nginx — sajikan web app statis. TIDAK ada pemrosesan data di server.
server {
    listen 80;
    # "_" = jawab lewat IP VPS langsung. Ganti ke domain bila sudah punya.
    server_name _;

    root /var/www/assaamiyah/web;   # folder web/ dari repo
    index index.html;

    # file statis biasa
    location / {
        try_files $uri $uri/ =404;
    }

    # (opsional) batasi akses dengan Basic Auth — buka komentar bila perlu:
    # auth_basic "Login Guru";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # cache wajar untuk aset; template/json jangan terlalu lama agar update kebaca
    location ~* \.(js|css|png|jpg|jpeg|ttf|woff2?)$ { expires 7d; }
    location ~* \.(json|docx)$ { expires 10m; }

    client_max_body_size 1m;   # upload Excel diproses di browser, jadi server kecil saja
}
