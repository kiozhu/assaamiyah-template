<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emblem MDTU As-saamiyah">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15834a"/>
      <stop offset="1" stop-color="#0a5530"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c766"/>
      <stop offset="1" stop-color="#bd9526"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="100" cy="100" r="96" fill="url(#g)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="78" fill="#f7f4ea"/>

  <!-- bintang penghias atas/bawah -->
  <g fill="url(#gold)">
    <path d="M100 17 l2.3 4.6 5.1.7-3.7 3.6.9 5-4.6-2.4-4.6 2.4.9-5-3.7-3.6 5.1-.7z"/>
    <circle cx="60" cy="30" r="1.8" opacity=".8"/>
    <circle cx="140" cy="30" r="1.8" opacity=".8"/>
  </g>

  <!-- crescent -->
  <path d="M100 40 a13 13 0 1 0 9.2 22.2 a10.5 10.5 0 1 1 0 -18.4 A13 13 0 0 0 100 40z" fill="url(#gold)"/>

  <!-- kubah masjid + menara -->
  <g fill="url(#g)">
    <path d="M100 66 C 84 76 80 96 80 110 L120 110 C120 96 116 76 100 66 Z"/>
    <rect x="74" y="110" width="52" height="7" rx="2"/>
    <rect x="64" y="84" width="6" height="33" rx="3"/>
    <rect x="130" y="84" width="6" height="33" rx="3"/>
    <circle cx="67" cy="80" r="4"/>
    <circle cx="133" cy="80" r="4"/>
  </g>

  <!-- kitab terbuka (ilmu) -->
  <g>
    <path d="M62 126 Q100 118 100 124 L100 150 Q100 144 62 152 Z" fill="url(#g)"/>
    <path d="M138 126 Q100 118 100 124 L100 150 Q100 144 138 152 Z" fill="#0a5530"/>
    <g stroke="#f7f4ea" stroke-width="1.6" opacity=".7" stroke-linecap="round">
      <path d="M70 130 h22"/><path d="M70 136 h22"/><path d="M70 142 h22"/>
      <path d="M108 130 h22"/><path d="M108 136 h22"/><path d="M108 142 h22"/>
    </g>
  </g>
</svg>
